name: E2E happy path

# Guards Divvy's core loop (sign in → create group → add expense → balances →
# settle renders) so a deploy can't silently break it. Runs the fast selftests
# first, then the browser-driven end-to-end smoke test.
on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Unit / security selftests
        run: npm test

      - name: End-to-end happy path
        env:
          # playwright-core launches this system Chrome; the test script reads it.
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e
