# Build the Divvy iOS shell and upload it to TestFlight — no Mac required.
#
# Trigger: manual (Actions tab → iOS TestFlight → Run workflow), or ask Claude
# to trigger it. Each run archives the Capacitor shell against the production
# origin, signs it with certs managed by fastlane match (stored encrypted on
# the ios-certificates branch), and pushes the build to TestFlight.
#
# One-time setup (browser only) is documented in docs/TESTFLIGHT-NO-MAC.md.

name: iOS TestFlight

on:
  # Committing a bump to .testflight-build fires a build (this session's git
  # access can push only the working branch — no tags, no dispatch API).
  # Push-triggered runs carry no inputs, so they need the ASC_KEY_P8(_B64) +
  # MATCH_PASSWORD repo secrets.
  push:
    branches:
      - "claude/divvy-repo-setup-61epmw"
    paths:
      - ".testflight-build"
  workflow_dispatch:
    inputs:
      # BOOTSTRAP ONLY: lets the first builds run before repo secrets exist.
      # Dispatch inputs are visible to anyone with read access to this repo
      # (private, single-owner) and persist in the run history — so once things
      # work, add the real secrets (docs/TESTFLIGHT-NO-MAC.md §4), re-run
      # without inputs, and rotate the API key in App Store Connect.
      asc_key_p8_b64:
        description: "App Store Connect API .p8 key, base64-encoded (fallback: ASC_KEY_P8/ASC_KEY_P8_B64 secret)"
        required: false
      match_password:
        description: "Cert-store passphrase (fallback: MATCH_PASSWORD secret)"
        required: false

permissions:
  contents: write # fastlane match stores/reads certs on the ios-certificates branch

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 90 # cold first archives on shared 3-core runners can pass 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Warm rebuilds: reuse resolved Swift packages + Xcode's DerivedData so
      # only changed sources recompile (a cold archive is ~45+ min; warm is a
      # fraction of that). Keyed to the Capacitor deps that feed Package.swift.
      - name: Cache Swift packages + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ios-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ios-build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios
        env:
          CAP_SERVER_URL: https://demo.wildfireonsol.com

      # Run 1 hung for 59 minutes inside xcodebuild's SPM resolution (right
      # after "Checking out capacitor-swift-pm") until the job timeout killed
      # it. Known runner failure mode: Xcode shells out to system git, which
      # can wait on credentials forever. Force Xcode's built-in git, skip the
      # interactive macro/plugin validation prompts, and cap+retry the resolve
      # so a hang costs 6 minutes, not the whole job. gym then skips its own
      # resolution (see Fastfile).
      - name: Resolve Swift packages (hang-hardened)
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM YES
          for i in 1 2 3; do
            if gtimeout 360 xcodebuild -resolvePackageDependencies \
                 -project ios/App/App.xcodeproj -scheme App \
                 -skipMacroValidation -skipPackagePluginValidation; then
              exit 0
            fi
            echo "::warning::SPM resolve attempt $i hung or failed; clearing caches and retrying"
            rm -rf ~/Library/Developer/Xcode/DerivedData ~/Library/Caches/org.swift.swiftpm
          done
          echo "::error::SPM resolution failed after 3 attempts"; exit 1

      - name: Build, sign, and upload to TestFlight
        run: fastlane ios beta
        env:
          # Key/issuer/team are identifiers, not credentials — safe as defaults.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '3BMYG9X69S' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '41f91417-38b0-41ba-b5e6-ce6d610a84ab' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '77PA8XZNBD' }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_B64: ${{ inputs.asc_key_p8_b64 || secrets.ASC_KEY_P8_B64 }}
          MATCH_PASSWORD: ${{ inputs.match_password || secrets.MATCH_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ~/Library/Logs/gym/*.log
            build/*.log
          if-no-files-found: ignore
