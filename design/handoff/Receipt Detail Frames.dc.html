<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050d15; }
  .rc-scroll::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes rcSquish { 0%,100% { border-radius:47% 53% 52% 48% / 55% 48% 52% 45%; } 50% { border-radius:53% 47% 48% 52% / 46% 54% 47% 53%; } }
  @keyframes rcBlink { 0%,91%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
  @keyframes rcPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @keyframes rcFloat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  @keyframes rcWaveL { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(0deg); } }
  @keyframes rcWaveR { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(0deg); } }
</style>
</helmet>

<div style="position:relative; width:390px; height:844px; background:#0B1622; overflow:hidden; font-family:'General Sans',sans-serif; color:#F4F7FA; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;">

  <!-- faint money texture + glow -->
  <div style="position:absolute; inset:0; background-image:repeating-radial-gradient(circle at 84% 2%, rgba(244,247,250,0.025) 0 1px, transparent 1px 8px); opacity:.6; pointer-events:none;"></div>
  <div style="position:absolute; left:50%; top:40px; width:360px; height:300px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle, {{ glowColor }} 0%, rgba(39,117,202,0) 70%); pointer-events:none;"></div>

  <!-- status bar -->
  <div style="position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 30px 0 32px; flex:none;">
    <span style="font-family:'Space Mono',monospace; font-size:14px; font-weight:700; letter-spacing:.5px;">9:41</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(244,247,250,0.6);">5G</span>
      <div style="width:24px; height:12px; border:1px solid rgba(244,247,250,0.45); border-radius:3px; padding:1.5px; display:flex; align-items:center;"><div style="width:100%; height:100%; background:#F4F7FA; border-radius:1px;"></div></div>
    </div>
  </div>

  <!-- top bar -->
  <div style="position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 16px; flex:none;">
    <div style="width:38px; height:38px; border-radius:50%; background:#13212E; border:1px solid rgba(244,247,250,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.2px; color:#F4F7FA;">receipt</span>
    <div style="width:38px; height:38px; border-radius:50%; background:#13212E; border:1px solid rgba(244,247,250,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
  </div>

  <!-- ============ SCROLL ============ -->
  <div class="rc-scroll" style="position:relative; z-index:2; flex:1; overflow-y:auto; scrollbar-width:none; padding:8px 20px 18px; display:flex; flex-direction:column;">

    <!-- RECEIPT CARD (wrapped so mascot can peek over the top edge) -->
    <div style="position:relative; margin-top:40px;">

    <!-- peeking full-body mascot -->
    <div style="position:absolute; top:-40px; right:28px; z-index:4; animation:rcFloat 5s ease-in-out infinite;">
      <div style="position:absolute; inset:-16px; border-radius:50%; background:radial-gradient(circle, rgba(39,117,202,0.42) 0%, rgba(39,117,202,0) 70%); animation:rcPulse 3s ease-in-out infinite; z-index:-2;"></div>
      <div style="position:relative; width:62px; height:62px; background:linear-gradient(155deg,#4aa0f0,#2775CA 60%,#1c5697); animation:rcSquish 4.5s ease-in-out infinite; box-shadow:0 12px 28px rgba(39,117,202,0.55), inset 0 2px 5px rgba(255,255,255,0.28); display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; left:22px; bottom:-6px; width:8px; height:14px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); z-index:-1;"></div>
        <div style="position:absolute; right:22px; bottom:-6px; width:8px; height:14px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); z-index:-1;"></div>
        <div style="position:absolute; left:-5px; top:23px; width:9px; height:17px; border-radius:999px; background:linear-gradient(160deg,#3f93e4,#2061a8); transform-origin:6px 2px; animation:rcWaveL 4.2s ease-in-out infinite; z-index:-1;"></div>
        <div style="position:absolute; right:-5px; top:23px; width:9px; height:17px; border-radius:999px; background:linear-gradient(160deg,#3f93e4,#2061a8); transform-origin:3px 2px; animation:rcWaveR 4.2s ease-in-out infinite; z-index:-1;"></div>
        <div style="display:flex; gap:8px; margin-top:-4px;">
          <div style="width:6px; height:8px; border-radius:50%; background:#0B1622; animation:rcBlink 5s infinite;"></div>
          <div style="width:6px; height:8px; border-radius:50%; background:#0B1622; animation:rcBlink 5s infinite;"></div>
        </div>
        <div style="position:absolute; bottom:18px; width:12px; height:6px; border:2.4px solid #0B1622; border-top:none; border-radius:0 0 8px 8px;"></div>
      </div>
    </div>

    <div style="position:relative; background:#13212E; border-radius:24px 24px 0 0; border:1px solid rgba(244,247,250,0.08); border-bottom:none; box-shadow:0 18px 46px rgba(0,0,0,0.4); overflow:hidden;">
      <!-- money texture (guilloché) -->
      <div style="position:absolute; inset:0; background-image:repeating-radial-gradient(circle at 90% 4%, rgba(255,255,255,0.04) 0 1px, transparent 1px 8px); opacity:.7; pointer-events:none;"></div>
      <!-- soft foil shimmer (barely visible, no hard line) -->
      <div style="position:absolute; top:0; bottom:0; right:0; width:140px; background:linear-gradient(102deg, transparent 0%, rgba(127,192,255,0.045) 48%, rgba(255,255,255,0.03) 58%, transparent 100%); pointer-events:none;"></div>
      <div style="position:absolute; left:0; right:0; top:0; height:4px; background:linear-gradient(90deg,#2775CA,#3DE8C7);"></div>

      <div style="position:relative; padding:22px 22px 8px;">
        <!-- top row: FINALIZED + mascot -->
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="display:inline-flex; align-items:center; gap:7px; background:rgba(61,232,199,0.12); border:1px solid rgba(61,232,199,0.42); border-radius:999px; padding:5px 12px;">
            <span style="width:6px; height:6px; border-radius:50%; background:#3DE8C7; box-shadow:0 0 8px rgba(61,232,199,0.9); animation:rcPulse 2.4s ease-in-out infinite;"></span>
            <span style="font-family:'Space Mono',monospace; font-weight:700; font-size:10px; letter-spacing:1px; color:#3DE8C7;">FINALIZED</span>
          </span>
        </div>

        <!-- who -->
        <div style="display:flex; align-items:center; gap:12px; margin-top:22px;">
          <div style="display:flex; align-items:center;">
            <div style="width:42px; height:42px; border-radius:50%; background:linear-gradient(150deg,#3DE8C7,#2775CA); border:2px solid #13212E; display:flex; align-items:center; justify-content:center; font-size:20px;">🦊</div>
            <svg width="20" height="14" viewBox="0 0 26 14" fill="none" stroke="rgba(244,247,250,0.4)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="margin:0 -2px 0 6px;"><path d="M1 7h22m-5-5 5 5-5 5"/></svg>
            <div style="width:42px; height:42px; border-radius:50%; background:linear-gradient(150deg,#FFC65C,#FF6B5E); border:2px solid #13212E; margin-left:6px; display:flex; align-items:center; justify-content:center; font-size:20px;">🦊</div>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-family:'General Sans',sans-serif; font-weight:500; font-size:16px; color:#F4F7FA;">{{ headline }}</div>
            <div style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.3px; color:rgba(244,247,250,0.45); margin-top:3px;">{{ flow }}</div>
          </div>
        </div>

        <!-- big amount -->
        <div style="margin-top:20px;">
          <div style="font-family:'Space Mono',monospace; font-weight:700; font-size:58px; line-height:.95; letter-spacing:-2.5px; color:{{ accent }}; text-shadow:0 0 34px {{ glowColor }};"><span style="font-size:30px; opacity:.5;">{{ sign }}$</span>24<span style="font-size:30px; opacity:.5;">.00</span></div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:9px;">
            <span style="font-family:'General Sans',sans-serif; font-size:14px; color:rgba(244,247,250,0.55);">{{ subline }}</span>
            <span style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; color:rgba(244,247,250,0.35);">· 24.00 usdc</span>
          </div>
        </div>

        <div style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.3px; color:rgba(244,247,250,0.5); margin-top:16px;">apartment 4b · jun 24, 9:32pm</div>
      </div>

      <!-- dashed divider -->
      <div style="position:relative; height:1px; margin:14px 0 0; border-top:1.5px dashed rgba(244,247,250,0.16);">
        <div style="position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#0B1622;"></div>
        <div style="position:absolute; right:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#0B1622;"></div>
      </div>

      <!-- on-chain metadata -->
      <div style="position:relative; padding:18px 22px 22px;">
        <div style="font-family:'Space Mono',monospace; font-size:9px; letter-spacing:2px; color:rgba(244,247,250,0.4); margin-bottom:14px;">ON-CHAIN PROOF</div>
        <div style="display:flex; flex-direction:column; gap:13px;">

          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">from</span>
            <span style="font-family:'Space Mono',monospace; font-size:12px; color:#F4F7FA;">9xQ…cMu <span style="color:rgba(244,247,250,0.4);">(ava)</span></span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">to</span>
            <span style="font-family:'Space Mono',monospace; font-size:12px; color:#F4F7FA;">7xKX…gAsU <span style="color:rgba(244,247,250,0.4);">(you)</span></span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">network</span>
            <span style="display:inline-flex; align-items:center; gap:6px;"><span style="width:6px; height:6px; border-radius:50%; background:#3DE8C7; box-shadow:0 0 6px rgba(61,232,199,0.8);"></span><span style="font-family:'Space Mono',monospace; font-size:12px; color:#F4F7FA;">solana</span></span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">fee</span>
            <span style="font-family:'Space Mono',monospace; font-size:12px; color:#3DE8C7;">~$0.0001</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">reference</span>
            <span style="font-family:'Space Mono',monospace; font-size:12px; color:#F4F7FA;">7xKX…gAsU</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span style="font-family:'Space Mono',monospace; font-size:11.5px; color:rgba(244,247,250,0.45);">signature</span>
            <span style="display:inline-flex; align-items:center; gap:7px;">
              <span style="font-family:'Space Mono',monospace; font-size:12px; color:#F4F7FA;">5gT9…wZ4</span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,250,0.55)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </span>
          </div>

        </div>

        <!-- solscan link -->
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:18px; padding-top:16px; border-top:1px solid rgba(244,247,250,0.07); cursor:pointer;">
          <span style="font-family:'Space Mono',monospace; font-size:12px; color:#7fc0ff;">view on solscan</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7fc0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </div>
      </div>
    </div>

    </div>
    <!-- /card wrapper -->

    <!-- perforated bottom edge -->
    <div style="height:14px; background:radial-gradient(circle at 10px 14px, #0B1622 0 7px, transparent 7.5px); background-size:20px 14px; background-repeat:repeat-x; margin-bottom:8px;"></div>

    <div style="flex:1; min-height:14px;"></div>

    <!-- actions -->
    <button style="appearance:none; border:none; cursor:pointer; width:100%; min-height:56px; border-radius:999px; background:linear-gradient(120deg,#3286db,#2775CA); display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 12px 30px rgba(39,117,202,0.5), inset 0 1px 0 rgba(255,255,255,0.25);" style-hover="filter:brightness(1.07);" style-active="transform:translateY(1px);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:17px; color:#fff;">share proof</span>
      <span style="font-size:15px;">✨</span>
    </button>
    <div style="display:flex; justify-content:center; margin-top:14px;">
      <span style="font-family:'General Sans',sans-serif; font-size:15px; color:rgba(244,247,250,0.5); cursor:pointer; padding:6px 18px;">done</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 390, &quot;height&quot;: 844 },
  &quot;direction&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;received&quot;, &quot;sent&quot;], &quot;default&quot;: &quot;received&quot;, &quot;tsType&quot;: &quot;'received' | 'sent'&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const sent = (this.props.direction ?? "received") === "sent";
    return {
      headline: sent ? "you chipped in" : "ava chipped in",
      flow: sent ? "you → ava" : "ava → you",
      sign: sent ? "−" : "+",
      subline: sent ? "you sent · settled" : "you received · settled",
      accent: sent ? "#FF6B5E" : "#3B92E8",
      glowColor: sent ? "rgba(255,107,94,0.28)" : "rgba(39,117,202,0.22)",
    };
  }
}
</script>
</body>
</html>
