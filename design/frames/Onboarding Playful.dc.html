<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050d15; }
  @keyframes obFloat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  @keyframes obSquish { 0%,100% { border-radius:47% 53% 52% 48% / 55% 48% 52% 45%; } 50% { border-radius:53% 47% 48% 52% / 46% 54% 47% 53%; } }
  @keyframes obBlink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  @keyframes obGlow { 0%,100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity:.85; } 50% { transform: translate(-50%,-50%) scale(1.12) rotate(18deg); opacity:1; } }
  @keyframes obWaveL { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(0deg); } }
  @keyframes obWaveR { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(0deg); } }
</style>
</helmet>

<div style="position:relative; width:390px; height:844px; background:#0B1622; overflow:hidden; font-family:'General Sans','Space Grotesk',sans-serif; color:#F4F7FA; -webkit-font-smoothing:antialiased;">

  <div style="position:absolute; inset:0; background-image:repeating-radial-gradient(circle at 50% 22%, rgba(244,247,250,0.03) 0 1px, transparent 1px 8px); opacity:.7; pointer-events:none;"></div>

  <!-- status bar -->
  <div style="position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 30px 0 32px;">
    <span style="font-family:'Space Mono',monospace; font-size:14px; font-weight:700; letter-spacing:.5px;">9:41</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(244,247,250,0.6);">5G</span>
      <div style="width:24px; height:12px; border:1px solid rgba(244,247,250,0.45); border-radius:3px; padding:1.5px; display:flex; align-items:center;">
        <div style="width:100%; height:100%; background:#F4F7FA; border-radius:1px;"></div>
      </div>
    </div>
  </div>

  <div style="position:relative; z-index:2; height:calc(844px - 50px); display:flex; flex-direction:column; padding:0 26px;">

    <!-- HERO -->
    <div style="display:flex; flex-direction:column; align-items:center; padding-top:48px;">
      <!-- mascot + kinetic glow -->
      <div style="position:relative; width:170px; height:150px; display:flex; align-items:center; justify-content:center;">
        <div style="position:absolute; left:50%; top:50%; width:200px; height:200px; border-radius:46% 54% 52% 48%; background:conic-gradient(from 0deg, rgba(39,117,202,0.55), rgba(61,232,199,0.45), rgba(39,117,202,0.55)); filter:blur(34px); animation:obGlow 7s ease-in-out infinite; pointer-events:none;"></div>
        <div style="position:relative; animation:obFloat 5.5s ease-in-out infinite;">
          <!-- legs -->
          <div style="position:absolute; left:39px; bottom:-13px; width:17px; height:27px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); box-shadow:0 4px 9px rgba(39,117,202,0.4);"></div>
          <div style="position:absolute; right:39px; bottom:-13px; width:17px; height:27px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); box-shadow:0 4px 9px rgba(39,117,202,0.4);"></div>
          <!-- arms -->
          <div style="position:absolute; left:-9px; top:45px; width:19px; height:32px; border-radius:999px; background:linear-gradient(160deg,#3f93e4,#2061a8); transform-origin:14px 4px; animation:obWaveL 4.2s ease-in-out infinite; box-shadow:0 4px 10px rgba(39,117,202,0.4);"></div>
          <div style="position:absolute; right:-9px; top:45px; width:19px; height:32px; border-radius:999px; background:linear-gradient(160deg,#3f93e4,#2061a8); transform-origin:5px 4px; animation:obWaveR 4.2s ease-in-out infinite; box-shadow:0 4px 10px rgba(39,117,202,0.4);"></div>
          <div style="position:relative; width:118px; height:118px; background:linear-gradient(155deg,#4aa0f0,#2775CA 60%,#1c5697); animation:obSquish 4.5s ease-in-out infinite; box-shadow:0 18px 44px rgba(39,117,202,0.55), inset 0 4px 8px rgba(255,255,255,0.28); display:flex; align-items:center; justify-content:center;">
            <div style="display:flex; gap:15px; margin-top:-8px;">
              <div style="width:14px; height:18px; border-radius:50%; background:#0B1622; animation:obBlink 5s ease-in-out infinite;"></div>
              <div style="width:14px; height:18px; border-radius:50%; background:#0B1622; animation:obBlink 5s ease-in-out infinite;"></div>
            </div>
            <div style="position:absolute; bottom:34px; width:22px; height:11px; border:3px solid #0B1622; border-top:none; border-radius:0 0 14px 14px;"></div>
            <div style="position:absolute; top:32px; left:22px; width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,0.22);"></div>
          </div>
        </div>
      </div>

      <!-- wordmark -->
      <div style="display:flex; align-items:center; gap:1px; margin-top:18px;">
        <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:700; font-size:40px; line-height:1; letter-spacing:-1.5px; color:#F4F7FA;">div</span>
        <span style="display:inline-block; width:11px; height:38px; background:#2775CA; border-radius:2px; transform:skewX(-13deg); margin:0 6px; box-shadow:0 0 16px rgba(39,117,202,0.5);"></span>
        <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:700; font-size:40px; line-height:1; letter-spacing:-1.5px; color:#F4F7FA;">vy</span>
      </div>

      <span style="font-family:'Space Mono',monospace; font-size:11px; font-weight:400; letter-spacing:1.5px; color:rgba(244,247,250,0.45); margin-top:20px;">split bills · get paid in usdc</span>

      <h1 style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:27px; line-height:1.22; letter-spacing:-0.6px; text-align:center; text-wrap:pretty; max-width:320px; margin:12px 0 0; color:#F4F7FA;">split the bill. get your money back — before you leave the table.</h1>

      <!-- 3-step strip -->
      <div style="display:flex; align-items:center; gap:9px; margin-top:26px;">
        <span style="width:7px; height:7px; border-radius:50%; background:#3DE8C7; box-shadow:0 0 8px rgba(61,232,199,0.7);"></span>
        <span style="font-family:'Space Mono',monospace; font-size:11px; font-weight:400; letter-spacing:1.5px; color:rgba(244,247,250,0.62);">scan</span>
        <span style="width:24px; height:1.5px; background:rgba(244,247,250,0.16);"></span>
        <span style="width:7px; height:7px; border-radius:50%; background:rgba(244,247,250,0.4);"></span>
        <span style="font-family:'Space Mono',monospace; font-size:11px; font-weight:400; letter-spacing:1.5px; color:rgba(244,247,250,0.62);">split</span>
        <span style="width:24px; height:1.5px; background:rgba(244,247,250,0.16);"></span>
        <span style="width:7px; height:7px; border-radius:50%; background:rgba(244,247,250,0.4);"></span>
        <span style="font-family:'Space Mono',monospace; font-size:11px; font-weight:400; letter-spacing:1.5px; color:rgba(244,247,250,0.62);">settle</span>
      </div>
    </div>

    <div style="flex:1;"></div>

    <!-- ACTIONS -->
    <div style="display:flex; flex-direction:column; gap:11px; padding-bottom:18px;">
      <button style="appearance:none; border:none; cursor:pointer; width:100%; min-height:62px; border-radius:999px; background:linear-gradient(120deg,#3286db,#2775CA); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 10px 30px rgba(39,117,202,0.45);" style-hover="filter:brightness(1.07);" style-active="transform:translateY(1px);">
        <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:17px; color:#fff;">create a wallet</span>
        <span style="font-family:'Space Mono',monospace; font-size:10px; font-weight:400; letter-spacing:0.8px; color:rgba(255,255,255,0.78);">10 seconds · no seed phrase</span>
      </button>

      <button style="appearance:none; cursor:pointer; width:100%; min-height:52px; border-radius:999px; background:transparent; border:1px solid rgba(244,247,250,0.18); font-family:'General Sans',sans-serif; font-weight:500; font-size:16px; color:#F4F7FA;" style-hover="background:rgba(244,247,250,0.05); border-color:rgba(244,247,250,0.3);" style-active="transform:translateY(1px);">connect a wallet</button>

      <div style="display:flex; align-items:center; gap:12px; padding:3px 0;">
        <span style="flex:1; height:1px; background:rgba(244,247,250,0.10);"></span>
        <span style="font-family:'Space Mono',monospace; font-size:10px; font-weight:400; letter-spacing:1px; color:rgba(244,247,250,0.4);">or continue with</span>
        <span style="flex:1; height:1px; background:rgba(244,247,250,0.10);"></span>
      </div>

      <div style="display:flex; gap:11px;">
        <button style="appearance:none; cursor:pointer; flex:1; min-height:50px; border-radius:999px; background:transparent; border:1px solid rgba(244,247,250,0.18); display:flex; align-items:center; justify-content:center; gap:8px; font-family:'General Sans',sans-serif; font-weight:500; font-size:15px; color:#F4F7FA;" style-hover="background:rgba(244,247,250,0.05); border-color:rgba(244,247,250,0.3);" style-active="transform:translateY(1px);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#F4F7FA" aria-hidden="true"><path d="M17.05 12.54c-.02-2.13 1.74-3.15 1.82-3.2-1-1.45-2.54-1.65-3.09-1.67-1.31-.13-2.57.77-3.24.77-.67 0-1.7-.75-2.8-.73-1.44.02-2.77.84-3.51 2.12-1.5 2.6-.38 6.44 1.07 8.55.71 1.03 1.55 2.19 2.66 2.15 1.07-.04 1.47-.69 2.76-.69s1.65.69 2.78.67c1.15-.02 1.87-1.05 2.57-2.09.81-1.2 1.14-2.36 1.16-2.42-.03-.01-2.22-.85-2.24-3.38zM14.94 5.69c.59-.72.99-1.71.88-2.69-.85.03-1.88.57-2.49 1.28-.55.63-1.03 1.64-.9 2.6.95.07 1.92-.48 2.51-1.19z"/></svg>
          apple
        </button>
        <button style="appearance:none; cursor:pointer; flex:1; min-height:50px; border-radius:999px; background:transparent; border:1px solid rgba(244,247,250,0.18); display:flex; align-items:center; justify-content:center; gap:8px; font-family:'General Sans',sans-serif; font-weight:500; font-size:15px; color:#F4F7FA;" style-hover="background:rgba(244,247,250,0.05); border-color:rgba(244,247,250,0.3);" style-active="transform:translateY(1px);">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.21-2.36H12v4.46h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.72z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3c-1.08.72-2.45 1.16-4.06 1.16-3.12 0-5.77-2.11-6.71-4.95H1.28v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.3a7.21 7.21 0 0 1 0-4.6V6.62H1.28a12 12 0 0 0 0 10.77l4.01-3.09z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.62l4.01 3.09C6.23 6.86 8.88 4.75 12 4.75z"/></svg>
          google
        </button>
      </div>

      <button style="appearance:none; border:none; background:transparent; cursor:pointer; width:100%; padding:7px 0 2px; font-family:'General Sans',sans-serif; font-weight:400; font-size:14.5px; color:rgba(244,247,250,0.55);" style-hover="color:#F4F7FA;">sign in with email</button>

      <div style="text-align:center; margin-top:4px;">
        <span style="font-family:'Space Mono',monospace; font-size:10px; font-weight:400; letter-spacing:1px; color:rgba(244,247,250,0.38);">non-custodial · your keys · usdc on solana</span>
      </div>

      <div style="width:134px; height:5px; border-radius:3px; background:rgba(244,247,250,0.28); margin:6px auto 0;"></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 390, &quot;height&quot;: 844 }
}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
