<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050d15; }
  .cp-scroll::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes cpSquish { 0%,100% { border-radius:47% 53% 52% 48% / 55% 48% 52% 45%; } 50% { border-radius:53% 47% 48% 52% / 46% 54% 47% 53%; } }
  @keyframes cpBlink { 0%,91%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
  @keyframes cpPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @keyframes cpFloat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
  @keyframes cpWaveL { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(2deg); } }
  @keyframes cpHero { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
</style>
</helmet>

<div style="position:relative; width:390px; height:844px; background:#0B1622; overflow:hidden; font-family:'General Sans',sans-serif; color:#F4F7FA; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;">

  <!-- faint money texture + glow -->
  <div style="position:absolute; inset:0; background-image:repeating-radial-gradient(circle at 84% 2%, rgba(244,247,250,0.025) 0 1px, transparent 1px 8px); opacity:.55; pointer-events:none;"></div>
  <div style="position:absolute; left:50%; top:90px; width:380px; height:260px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle, rgba(39,117,202,0.18) 0%, rgba(39,117,202,0) 70%); pointer-events:none;"></div>

  <!-- status bar -->
  <div style="position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 30px 0 32px; flex:none;">
    <span style="font-family:'Space Mono',monospace; font-size:14px; font-weight:700; letter-spacing:.5px;">9:41</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(244,247,250,0.6);">5G</span>
      <div style="width:24px; height:12px; border:1px solid rgba(244,247,250,0.45); border-radius:3px; padding:1.5px; display:flex; align-items:center;"><div style="width:100%; height:100%; background:#F4F7FA; border-radius:1px;"></div></div>
    </div>
  </div>

  <!-- top bar -->
  <div style="position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 16px; flex:none;">
    <div style="width:38px; height:38px; border-radius:50%; background:#13212E; border:1px solid rgba(244,247,250,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.2px; color:#F4F7FA;">make it yours</span>
    <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:15px; color:#3B92E8; cursor:pointer; padding:8px 6px;">save</span>
  </div>

  <!-- scroll -->
  <div class="cp-scroll" style="position:relative; z-index:2; flex:1; overflow-y:auto; scrollbar-width:none; padding:6px 18px 22px;">

    <!-- ===== HERO live preview ===== -->
    <div style="display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 0 6px;">
      <div style="position:relative; width:132px; height:132px; flex:none; animation:cpHero 5s ease-in-out infinite;">
        <div style="position:absolute; inset:-14px; border-radius:50%; background:radial-gradient(circle, rgba(39,117,202,0.4) 0%, rgba(39,117,202,0) 70%); animation:cpPulse 3.4s ease-in-out infinite;"></div>
        <div style="position:relative; width:132px; height:132px; border-radius:36px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.18);">
          <div style="position:absolute; inset:0; background:{{ heroBg }};"></div>
          <div style="position:absolute; inset:0; background-image:repeating-radial-gradient(circle at 80% 110%, rgba(255,255,255,0.1) 0 1px, transparent 1px 7px); opacity:.5;"></div>
          <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:68px;">{{ heroEmoji }}</div>
        </div>
      </div>

      <!-- mascot thumbs-up -->
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; flex:none;">
        <div style="background:#13212E; border:1px solid rgba(244,247,250,0.1); border-radius:14px 14px 14px 4px; padding:7px 11px;">
          <span style="font-family:'Space Mono',monospace; font-size:11px; color:rgba(244,247,250,0.75);">looking good 😎</span>
        </div>
        <div style="position:relative; width:54px; height:54px; animation:cpFloat 5s ease-in-out infinite; margin-left:6px;">
          <div style="position:absolute; inset:-7px; border-radius:50%; background:radial-gradient(circle, rgba(39,117,202,0.4) 0%, rgba(39,117,202,0) 70%); animation:cpPulse 3s ease-in-out infinite; z-index:-2;"></div>
          <div style="position:relative; width:46px; height:46px; background:linear-gradient(155deg,#4aa0f0,#2775CA 60%,#1c5697); animation:cpSquish 4.5s ease-in-out infinite; box-shadow:0 8px 18px rgba(39,117,202,0.5), inset 0 1px 4px rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center;">
            <div style="position:absolute; left:16px; bottom:-5px; width:7px; height:12px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); z-index:-1;"></div>
            <div style="position:absolute; right:16px; bottom:-5px; width:7px; height:12px; border-radius:999px; background:linear-gradient(160deg,#3a8fe0,#1f5da3); z-index:-1;"></div>
            <!-- left arm -->
            <div style="position:absolute; left:-5px; top:18px; width:8px; height:14px; border-radius:999px; background:linear-gradient(160deg,#3f93e4,#2061a8); transform-origin:5px 2px; animation:cpWaveL 3.4s ease-in-out infinite; z-index:-1;"></div>
            <!-- right arm raised: thumbs up -->
            <div style="position:absolute; right:-7px; top:6px; width:8px; height:15px; border-radius:999px; background:linear-gradient(160deg,#4a9ff0,#2a6fc0); transform:rotate(-26deg); z-index:-1;"></div>
            <div style="position:absolute; right:-9px; top:1px; font-size:11px; z-index:1;">👍</div>
            <!-- face -->
            <div style="display:flex; gap:6.5px; margin-top:-3px;">
              <div style="width:5px; height:6.5px; border-radius:50%; background:#0B1622; animation:cpBlink 5s infinite;"></div>
              <div style="width:5px; height:6.5px; border-radius:50%; background:#0B1622; animation:cpBlink 5s infinite;"></div>
            </div>
            <div style="position:absolute; bottom:13px; width:11px; height:5.5px; border:2.2px solid #0B1622; border-top:none; border-radius:0 0 7px 7px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== YOUR EMOJI ===== -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin:22px 2px 12px;">
      <span style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.45);">YOUR EMOJI</span>
      <div style="display:inline-flex; align-items:center; gap:7px; background:#13212E; border:1px solid rgba(244,247,250,0.09); border-radius:999px; padding:5px 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,250,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <span style="font-family:'Space Mono',monospace; font-size:10.5px; color:rgba(244,247,250,0.4);">search</span>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:9px;">
      <sc-for list="{{ emojis }}" as="e" hint-placeholder-count="18">
        <div onClick="{{ e.pick }}" style="position:relative; aspect-ratio:1; border-radius:14px; background:#13212E; border:1px solid rgba(244,247,250,0.06); display:flex; align-items:center; justify-content:center; font-size:23px; cursor:pointer;">
          {{ e.char }}
          <sc-if value="{{ e.selected }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; inset:-2px; border-radius:16px; border:2px solid #2775CA; box-shadow:0 0 14px rgba(39,117,202,0.6); pointer-events:none;"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <!-- ===== YOUR COLOR ===== -->
    <div style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.45); margin:24px 2px 12px;">YOUR COLOR</div>
    <div style="display:flex; flex-wrap:wrap; gap:11px;">
      <sc-for list="{{ colors }}" as="c" hint-placeholder-count="8">
        <div onClick="{{ c.pick }}" style="position:relative; width:50px; height:50px; border-radius:16px; background:{{ c.bg }}; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 14px rgba(0,0,0,0.25);">
          <sc-if value="{{ c.selected }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; inset:-3px; border-radius:19px; border:2.5px solid #fff; box-shadow:0 0 14px rgba(255,255,255,0.4); pointer-events:none;"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <!-- ===== NAME + HANDLE ===== -->
    <div style="margin-top:26px; display:flex; flex-direction:column; gap:13px;">
      <div>
        <div style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.45); margin-bottom:8px;">NAME</div>
        <div style="display:flex; align-items:center; gap:10px; background:#13212E; border:1px solid rgba(244,247,250,0.1); border-radius:16px; padding:15px 16px;">
          <span style="flex:1; font-family:'General Sans',sans-serif; font-weight:500; font-size:16px; color:#F4F7FA;">jordan</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,250,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
      </div>
      <div>
        <div style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.45); margin-bottom:8px;">HANDLE</div>
        <div style="display:flex; align-items:center; gap:6px; background:#13212E; border:1px solid rgba(39,117,202,0.3); border-radius:16px; padding:15px 16px;">
          <span style="font-family:'Space Mono',monospace; font-size:15px; color:rgba(127,192,255,0.7);">@</span>
          <span style="flex:1; font-family:'Space Mono',monospace; font-size:15px; color:#F4F7FA;">jordan<span style="display:inline-block; width:2px; height:17px; background:#2775CA; margin-left:2px; vertical-align:-3px; animation:cpPulse 1s steps(1) infinite;"></span></span>
          <span style="display:inline-flex; align-items:center; gap:5px; background:rgba(61,232,199,0.1); border:1px solid rgba(61,232,199,0.35); border-radius:999px; padding:3px 9px;"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#3DE8C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span style="font-family:'Space Mono',monospace; font-weight:700; font-size:9px; color:#3DE8C7;">free</span></span>
        </div>
      </div>
    </div>

    <div style="height:8px;"></div>
  </div>

  <!-- sticky save -->
  <div style="position:relative; z-index:6; flex:none; padding:12px 18px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(11,22,34,0) 0%, #0B1622 24%);">
    <button style="appearance:none; border:none; cursor:pointer; width:100%; min-height:56px; border-radius:999px; background:linear-gradient(120deg,#3286db,#2775CA); display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 12px 30px rgba(39,117,202,0.5), inset 0 1px 0 rgba(255,255,255,0.25);" style-hover="filter:brightness(1.07);" style-active="transform:translateY(1px);">
      <span style="font-family:'Clash Display','General Sans',sans-serif; font-weight:600; font-size:17px; color:#fff;">save</span>
      <span style="font-size:15px;">✨</span>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 390, &quot;height&quot;: 844 }
}">
class Component extends DCLogic {
  state = { emoji: "🦊", colorId: "blue-mint" };

  renderVals() {
    const COLORS = [
      { id: "blue", bg: "#2775CA" },
      { id: "mint", bg: "#3DE8C7" },
      { id: "coral", bg: "#FF6B5E" },
      { id: "sunshine", bg: "#FFC65C" },
      { id: "violet", bg: "#8B5CF6" },
      { id: "blue-mint", bg: "linear-gradient(150deg,#2775CA,#3DE8C7)" },
      { id: "coral-sun", bg: "linear-gradient(150deg,#FF6B5E,#FFC65C)" },
      { id: "violet-blue", bg: "linear-gradient(150deg,#8B5CF6,#2775CA)" },
    ];
    const EMOJIS = ["🦊","🐸","🐱","🐼","🐯","🐨","🦜","🐢","🌸","🍜","🍕","🍔","🌮","🎧","🛹","🪩","😎","🔥"];

    const sel = COLORS.find(c => c.id === this.state.colorId) || COLORS[5];

    return {
      heroEmoji: this.state.emoji,
      heroBg: sel.bg,
      emojis: EMOJIS.map(ch => ({
        char: ch,
        selected: ch === this.state.emoji,
        pick: () => this.setState({ emoji: ch }),
      })),
      colors: COLORS.map(c => ({
        bg: c.bg,
        selected: c.id === this.state.colorId,
        pick: () => this.setState({ colorId: c.id }),
      })),
    };
  }
}
</script>
</body>
</html>
