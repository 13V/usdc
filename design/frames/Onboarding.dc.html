<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #02090d; }
</style>
</helmet>

<div style="position:relative; width:390px; height:844px; background:#04121A; overflow:hidden; font-family:'Space Grotesk',sans-serif; color:#F6F1E7; -webkit-font-smoothing:antialiased;">

  <sc-if value="{{ glow }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; left:-90px; top:-40px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(39,117,202,0.34) 0%, rgba(39,117,202,0.10) 42%, rgba(39,117,202,0) 70%); pointer-events:none;"></div>
    <div style="position:absolute; left:0; right:0; top:0; height:300px; background:linear-gradient(180deg, rgba(39,117,202,0.10) 0%, rgba(39,117,202,0) 100%); pointer-events:none;"></div>
  </sc-if>

  <sc-if value="{{ receiptTexture }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; inset:0; background-image:repeating-linear-gradient(0deg, rgba(246,241,231,0.018) 0px, rgba(246,241,231,0.018) 1px, transparent 1px, transparent 6px); pointer-events:none;"></div>
  </sc-if>

  <!-- status bar -->
  <div style="position:relative; display:flex; align-items:center; justify-content:space-between; height:50px; padding:0 30px 0 32px;">
    <span style="font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; letter-spacing:.5px;">9:41</span>
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; color:rgba(246,241,231,0.58);">5G</span>
      <div style="width:24px; height:12px; border:1px solid rgba(246,241,231,0.45); border-radius:3px; padding:1.5px; display:flex; align-items:center;">
        <div style="width:100%; height:100%; background:#F6F1E7; border-radius:1px;"></div>
      </div>
    </div>
  </div>

  <div style="position:relative; height:calc(844px - 50px); display:flex; flex-direction:column; padding:0 28px 0;">

    <!-- HERO — left aligned, editorial -->
    <div style="padding-top:64px; display:flex; flex-direction:column; align-items:flex-start;">
      <div style="display:flex; align-items:center; gap:3px;">
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; line-height:1; letter-spacing:-2px; color:#F6F1E7;">div</span>
        <span style="display:inline-block; width:13px; height:44px; background:#2775CA; border-radius:2.5px; transform:skewX(-13deg); margin:0 7px; box-shadow:0 0 18px rgba(39,117,202,0.45);"></span>
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; line-height:1; letter-spacing:-2px; color:#F6F1E7;">vy</span>
      </div>

      <span style="font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:500; letter-spacing:2.5px; color:rgba(246,241,231,0.45); margin-top:40px;">SPLIT BILLS · GET PAID IN USDC</span>

      <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:31px; line-height:1.22; letter-spacing:-0.8px; text-wrap:pretty; margin:13px 0 0; max-width:330px; color:#F6F1E7;">Split the bill.<br>Get paid back in <span style="color:#2775CA;">USDC</span> —<br>instant, no chargebacks.</h1>

      <sc-if value="{{ journeyStrip }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; align-items:center; gap:10px; margin-top:30px;">
          <span style="width:7px; height:7px; border-radius:50%; background:#2775CA; box-shadow:0 0 8px rgba(39,117,202,0.6);"></span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:2.5px; color:rgba(246,241,231,0.72);">SCAN</span>
          <span style="width:22px; height:1px; background:rgba(246,241,231,0.16);"></span>
          <span style="width:7px; height:7px; border-radius:50%; background:rgba(246,241,231,0.40);"></span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:2.5px; color:rgba(246,241,231,0.72);">SPLIT</span>
          <span style="width:22px; height:1px; background:rgba(246,241,231,0.16);"></span>
          <span style="width:7px; height:7px; border-radius:50%; background:rgba(246,241,231,0.40);"></span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:2.5px; color:rgba(246,241,231,0.72);">SETTLE</span>
        </div>
      </sc-if>
    </div>

    <div style="flex:1;"></div>

    <!-- perforation tear line (receipt motif) -->
    <div style="position:relative; height:1px; margin:0 -28px 26px; border-top:1.5px dashed rgba(246,241,231,0.16);">
      <div style="position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#04121A; border:1px solid rgba(246,241,231,0.10);"></div>
      <div style="position:absolute; right:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#04121A; border:1px solid rgba(246,241,231,0.10);"></div>
    </div>

    <!-- ACTIONS -->
    <div style="display:flex; flex-direction:column; gap:11px; padding-bottom:14px;">
      <button style="appearance:none; border:none; cursor:pointer; width:100%; min-height:60px; border-radius:15px; background:#2775CA; padding:11px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; box-shadow:0 6px 20px rgba(39,117,202,0.28);" style-hover="filter:brightness(1.06);" style-active="transform:translateY(1px);">
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; color:#fff;">Create a wallet</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:500; letter-spacing:1.5px; color:rgba(255,255,255,0.78);">10 SECONDS, NO APP</span>
      </button>

      <button style="appearance:none; cursor:pointer; width:100%; min-height:52px; border-radius:15px; background:transparent; border:1px solid rgba(246,241,231,0.16); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:16px; color:#F6F1E7;" style-hover="background:#0E2734; border-color:rgba(246,241,231,0.26);" style-active="transform:translateY(1px);">Connect a wallet</button>

      <div style="display:flex; align-items:center; gap:12px; padding:2px 0;">
        <span style="flex:1; height:1px; background:rgba(246,241,231,0.10);"></span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; letter-spacing:2px; color:rgba(246,241,231,0.40);">OR CONTINUE WITH</span>
        <span style="flex:1; height:1px; background:rgba(246,241,231,0.10);"></span>
      </div>

      <div style="display:flex; gap:12px;">
        <button style="appearance:none; cursor:pointer; flex:1; min-height:50px; border-radius:15px; background:transparent; border:1px solid rgba(246,241,231,0.16); display:flex; align-items:center; justify-content:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:15px; color:#F6F1E7;" style-hover="background:#0E2734; border-color:rgba(246,241,231,0.26);" style-active="transform:translateY(1px);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#F6F1E7" aria-hidden="true"><path d="M17.05 12.54c-.02-2.13 1.74-3.15 1.82-3.2-1-1.45-2.54-1.65-3.09-1.67-1.31-.13-2.57.77-3.24.77-.67 0-1.7-.75-2.8-.73-1.44.02-2.77.84-3.51 2.12-1.5 2.6-.38 6.44 1.07 8.55.71 1.03 1.55 2.19 2.66 2.15 1.07-.04 1.47-.69 2.76-.69s1.65.69 2.78.67c1.15-.02 1.87-1.05 2.57-2.09.81-1.2 1.14-2.36 1.16-2.42-.03-.01-2.22-.85-2.24-3.38zM14.94 5.69c.59-.72.99-1.71.88-2.69-.85.03-1.88.57-2.49 1.28-.55.63-1.03 1.64-.9 2.6.95.07 1.92-.48 2.51-1.19z"/></svg>
          Apple
        </button>
        <button style="appearance:none; cursor:pointer; flex:1; min-height:50px; border-radius:15px; background:transparent; border:1px solid rgba(246,241,231,0.16); display:flex; align-items:center; justify-content:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:15px; color:#F6F1E7;" style-hover="background:#0E2734; border-color:rgba(246,241,231,0.26);" style-active="transform:translateY(1px);">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.6-.21-2.36H12v4.46h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.72z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3c-1.08.72-2.45 1.16-4.06 1.16-3.12 0-5.77-2.11-6.71-4.95H1.28v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.3a7.21 7.21 0 0 1 0-4.6V6.62H1.28a12 12 0 0 0 0 10.77l4.01-3.09z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.62l4.01 3.09C6.23 6.86 8.88 4.75 12 4.75z"/></svg>
          Google
        </button>
      </div>

      <button style="appearance:none; border:none; background:transparent; cursor:pointer; width:100%; padding:8px 0 2px; font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:14.5px; color:rgba(246,241,231,0.58);" style-hover="color:#F6F1E7;">Sign in with email</button>

      <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:400; letter-spacing:1.5px; color:rgba(246,241,231,0.40);">NON-CUSTODIAL</span>
        <span style="width:3px; height:3px; border-radius:50%; background:rgba(246,241,231,0.30);"></span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:400; letter-spacing:1.5px; color:rgba(246,241,231,0.40);">USDC ON SOLANA</span>
      </div>

      <div style="width:134px; height:5px; border-radius:3px; background:rgba(246,241,231,0.28); margin:6px auto 0;"></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 390, &quot;height&quot;: 844 },
  &quot;glow&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;receiptTexture&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },
  &quot;journeyStrip&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    return {
      glow: this.props.glow ?? true,
      receiptTexture: this.props.receiptTexture ?? true,
      journeyStrip: this.props.journeyStrip ?? true,
    };
  }
}
</script>
</body>
</html>
