<!doctype html>
<!--
  design/og/generate.html — source for the static Divvy share card.

  Render to public/og/card.png (1200x630) with:
    node design/og/generate.mjs
  (screenshots this file at 1200x630 via playwright-core). Journal aesthetic:
  warm paper, ruled lines, washi tape, the slash logo + wordmark, tagline, and a
  mint frog blob. Self-contained — no external fonts/images, so it renders the
  same everywhere and commits as one PNG.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  #card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    /* flat warm paper: a couple of soft tints kept as large flat-ish bands so the
       PNG stays small (big smooth radial gradients bloat a lossless PNG). */
    background: #F4ECD8;
    font-family: "Georgia", "Times New Roman", serif;
    color: #2B2118;
  }
  /* one soft mint corner glow (bottom-right, behind the frog) */
  #glow { position: absolute; right: -120px; bottom: -160px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(61,232,199,0.22), rgba(61,232,199,0) 62%); }
  /* ruled-notebook horizontal lines */
  #rules { position: absolute; inset: 0;
    background-image: repeating-linear-gradient(to bottom, transparent 0 47px, rgba(43,33,24,0.06) 47px 48px);
    opacity: .85; }
  /* red margin line, like a legal pad */
  #margin { position: absolute; top: 0; bottom: 0; left: 96px; width: 2px; background: rgba(255,107,94,0.35); }

  /* washi tape strips */
  .tape { position: absolute; width: 168px; height: 46px; opacity: .82;
    box-shadow: 0 6px 16px rgba(43,33,24,0.12); }
  .tape.a { top: 40px; left: 150px; transform: rotate(-6deg); background: rgba(255,198,92,0.72); }
  .tape.b { bottom: 54px; right: 120px; transform: rotate(5deg); background: rgba(61,232,199,0.62); }
  .tape::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.28) 0 8px, rgba(255,255,255,0) 8px 16px); }

  #content { position: absolute; left: 150px; top: 132px; right: 96px; }

  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  .mark {
    width: 92px; height: 92px; border-radius: 26px;
    background: linear-gradient(150deg, #3286db, #2775CA 58%, #1f5fa8);
    display: flex; align-items: center; justify-content: center;
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 62px; color: #fff;
    box-shadow: 6px 8px 0 rgba(43,33,24,0.85); border: 3px solid #2B2118;
    transform: rotate(-2deg);
  }
  .word {
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800;
    font-size: 74px; letter-spacing: -2.5px; color: #2B2118;
  }
  h1 {
    font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800;
    font-size: 78px; line-height: 1.02; letter-spacing: -2.5px; max-width: 720px;
    color: #2B2118; margin-bottom: 26px;
  }
  h1 .hl { color: #2775CA; }
  .tagline {
    font-family: "Courier New", monospace; font-weight: 700; font-size: 25px;
    letter-spacing: 0.5px; color: rgba(43,33,24,0.62);
    background: #FFFDF7; border: 2px solid #2B2118; border-radius: 999px;
    box-shadow: 4px 5px 0 rgba(43,33,24,0.85); padding: 12px 22px; display: inline-block;
    transform: rotate(-0.6deg);
  }

  /* mint frog blob, bottom-right */
  #frog { position: absolute; right: 118px; bottom: 96px; width: 300px; height: 300px; transform: rotate(4deg); }
</style>
</head>
<body>
  <div id="card">
    <div id="glow"></div>
    <div id="rules"></div>
    <div id="margin"></div>
    <div class="tape a"></div>
    <div class="tape b"></div>

    <svg id="frog" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- shadow -->
      <ellipse cx="152" cy="270" rx="104" ry="20" fill="rgba(43,33,24,0.10)"/>
      <!-- body blob -->
      <path d="M150 44c58 0 104 40 104 104 0 30-12 52-30 74 14 8 22 18 22 30 0 6-6 10-14 10-16 0-28-10-36-22-14 4-30 6-46 6s-32-2-46-6c-8 12-20 22-36 22-8 0-14-4-14-10 0-12 8-22 22-30-18-22-30-44-30-74C46 84 92 44 150 44Z" fill="#5FD6B8" stroke="#2B2118" stroke-width="6" stroke-linejoin="round"/>
      <!-- cheeks -->
      <circle cx="92" cy="182" r="16" fill="rgba(255,107,94,0.35)"/>
      <circle cx="212" cy="182" r="16" fill="rgba(255,107,94,0.35)"/>
      <!-- eye bumps -->
      <circle cx="112" cy="96" r="34" fill="#5FD6B8" stroke="#2B2118" stroke-width="6"/>
      <circle cx="192" cy="96" r="34" fill="#5FD6B8" stroke="#2B2118" stroke-width="6"/>
      <circle cx="112" cy="98" r="16" fill="#FFFDF7" stroke="#2B2118" stroke-width="4"/>
      <circle cx="192" cy="98" r="16" fill="#FFFDF7" stroke="#2B2118" stroke-width="4"/>
      <circle cx="116" cy="101" r="7" fill="#2B2118"/>
      <circle cx="196" cy="101" r="7" fill="#2B2118"/>
      <!-- smile -->
      <path d="M108 150c14 20 70 20 84 0" stroke="#2B2118" stroke-width="6" stroke-linecap="round"/>
      <!-- little dollar note -->
      <g transform="rotate(-8 150 210)">
        <rect x="120" y="196" width="60" height="34" rx="6" fill="#FFC65C" stroke="#2B2118" stroke-width="5"/>
        <text x="150" y="220" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="24" fill="#2B2118">$</text>
      </g>
    </svg>

    <div id="content">
      <div class="brand">
        <div class="mark">/</div>
        <div class="word">divvy</div>
      </div>
      <h1>you're invited to <span class="hl">split the bill</span>.</h1>
      <div class="tagline">split the bill. settle in dollars, instantly.</div>
    </div>
  </div>
</body>
</html>
