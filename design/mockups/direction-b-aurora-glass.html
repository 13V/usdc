<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { color:#F4F7FA; font-family:'General Sans',sans-serif; height:100vh; overflow:hidden;
    background:#070B14; }
  .mesh { position:fixed; inset:-30%;
    background:
      radial-gradient(42% 34% at 18% 12%, rgba(39,117,202,0.55), transparent 65%),
      radial-gradient(38% 30% at 85% 28%, rgba(139,92,246,0.42), transparent 65%),
      radial-gradient(44% 36% at 55% 88%, rgba(61,232,199,0.28), transparent 65%);
    filter: blur(40px); }
  .glass { background:rgba(255,255,255,0.055); border:1px solid rgba(255,255,255,0.13);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-radius:26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14); }
  .mono { font-family:'Space Mono',monospace; }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
  .gradtext { background:linear-gradient(115deg,#7FC0FF 10%,#3DE8C7 55%,#B79CFF 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
</style></head><body>
<div class="mesh"></div>
<div style="position:relative; padding:64px 20px 0; display:flex; flex-direction:column; height:100%;">

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <span class="disp" style="font-size:24px; letter-spacing:-0.8px;">div<span style="color:#7FC0FF;">/</span>vy</span>
    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,#FFC65C,#FF6B5E);box-shadow:0 0 0 2px rgba(255,255,255,0.2), 0 8px 24px rgba(255,107,94,0.4);display:flex;align-items:center;justify-content:center;font-size:19px;">🦊</div>
  </div>

  <!-- hero glass card -->
  <div class="glass" style="margin-top:20px; padding:26px 24px;">
    <div class="mono" style="font-size:11px; letter-spacing:2px; color:rgba(244,247,250,0.5);">YOU'RE OWED</div>
    <div class="mono gradtext" style="font-weight:700; font-size:76px; line-height:0.95; letter-spacing:-3px; margin-top:10px;">$247.50</div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:14px;">
      <div style="display:flex;">
        <span style="width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,#3DE8C7,#2775CA);border:2px solid rgba(7,11,20,0.8);display:flex;align-items:center;justify-content:center;font-size:13px;">🐢</span>
        <span style="width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,#8B5CF6,#2775CA);border:2px solid rgba(7,11,20,0.8);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:13px;">🦋</span>
        <span style="width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,#FFC65C,#FF6B5E);border:2px solid rgba(7,11,20,0.8);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:13px;">🐯</span>
      </div>
      <span class="mono" style="font-size:11px; color:rgba(244,247,250,0.55);">3 people owe you</span>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <div class="disp" style="flex:1; background:linear-gradient(120deg,#3286db,#2775CA); border-radius:999px; padding:15px 0; text-align:center; font-size:16px; box-shadow:0 10px 30px rgba(39,117,202,0.55), inset 0 1px 0 rgba(255,255,255,0.3);">settle up</div>
      <div class="disp" style="flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.16); border-radius:999px; padding:15px 0; text-align:center; font-size:16px;">request</div>
    </div>
  </div>

  <div style="display:flex; align-items:baseline; justify-content:space-between; margin:26px 4px 12px;">
    <span class="disp" style="font-size:21px;">open tabs</span>
    <span class="mono" style="font-size:11px; color:#3DE8C7; text-shadow:0 0 12px rgba(61,232,199,0.8);">● 2 live</span>
  </div>

  <div class="glass" style="padding:15px 18px; display:flex; align-items:center; gap:14px; border-radius:20px;">
    <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(150deg,rgba(255,198,92,0.35),rgba(255,107,94,0.25));border:1px solid rgba(255,198,92,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;">🍜</div>
    <div style="flex:1;"><div class="disp" style="font-size:16.5px;">dinner @ mano's</div><div class="mono" style="font-size:11px;color:rgba(244,247,250,0.45);margin-top:3px;">1 of 3 paid</div></div>
    <div class="mono" style="font-weight:700;font-size:18px;color:#7FC0FF;text-shadow:0 0 14px rgba(127,192,255,0.6);">$64.20</div>
  </div>
  <div class="glass" style="padding:15px 18px; display:flex; align-items:center; gap:14px; border-radius:20px; margin-top:12px;">
    <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(150deg,rgba(139,92,246,0.35),rgba(39,117,202,0.25));border:1px solid rgba(139,92,246,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;">🏠</div>
    <div style="flex:1;"><div class="disp" style="font-size:16.5px;">rent + utilities</div><div class="mono" style="font-size:11px;color:rgba(244,247,250,0.45);margin-top:3px;">due friday</div></div>
    <div class="mono" style="font-weight:700;font-size:18px;color:#B79CFF;text-shadow:0 0 14px rgba(183,156,255,0.6);">$183.30</div>
  </div>

  <div style="flex:1;"></div>

  <!-- floating dock -->
  <div class="glass" style="margin:0 10px 34px; border-radius:999px; display:flex; align-items:center; justify-content:space-around; padding:10px 12px;">
    <span class="mono" style="font-size:10.5px;color:#7FC0FF;text-shadow:0 0 10px rgba(127,192,255,0.8);">home</span>
    <span class="mono" style="font-size:10.5px;color:rgba(244,247,250,0.45);">groups</span>
    <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#3286db,#8B5CF6);box-shadow:0 0 28px rgba(139,92,246,0.7), inset 0 1px 0 rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin:-16px 0;">+</div>
    <span class="mono" style="font-size:10.5px;color:rgba(244,247,250,0.45);">feed</span>
    <span class="mono" style="font-size:10.5px;color:rgba(244,247,250,0.45);">you</span>
  </div>
</div>
</body></html>
