<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#0B1622; color:#F4F7FA; font-family:'Space Mono',monospace; height:100vh; overflow:hidden;
    background-image:repeating-radial-gradient(circle at 85% 4%, rgba(244,247,250,0.03) 0 1px, transparent 1px 9px); }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
  .receipt { background:#F4F7FA; color:#0B1622; position:relative; }
  .perf-b { -webkit-mask: radial-gradient(circle at 10px 100%, transparent 0 6px, #000 7px) -10px 0/20px 100%;
            mask: radial-gradient(circle at 10px 100%, transparent 0 6px, #000 7px) -10px 0/20px 100%; }
  .dashed { border-top:1.5px dashed rgba(11,22,34,0.25); }
  .stamp { display:inline-block; border:2.5px double #FF6B5E; color:#FF6B5E; border-radius:6px; padding:3px 9px;
    font-weight:700; font-size:11px; letter-spacing:2px; transform:rotate(-7deg); }
</style></head><body>
<div style="padding:60px 20px 0; display:flex; flex-direction:column; height:100%;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px;">
    <span class="disp" style="font-size:23px; letter-spacing:-0.6px;">div<span style="color:#2775CA;">/</span>vy</span>
    <span style="font-size:10px; letter-spacing:2px; color:rgba(244,247,250,0.45);">WED · JUL 02</span>
  </div>

  <!-- hero: a real receipt -->
  <div class="receipt perf-b" style="margin-top:18px; border-radius:14px 14px 0 0; padding:20px 22px 26px; box-shadow:0 18px 44px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div style="font-size:10px; letter-spacing:2.5px; color:rgba(11,22,34,0.5);">** BALANCE **</div>
        <div style="font-weight:700; font-size:64px; line-height:1; letter-spacing:-3px; margin-top:10px;">$247.50</div>
        <div style="font-size:11px; letter-spacing:1px; color:rgba(11,22,34,0.55); margin-top:6px;">OWED TO YOU · 3 PEOPLE</div>
      </div>
      <span class="stamp">UNPAID</span>
    </div>
    <div class="dashed" style="margin:18px -22px 0;"></div>
    <div style="display:flex; justify-content:space-between; padding-top:12px; font-size:12px;">
      <span style="color:rgba(11,22,34,0.6);">maya · dinner</span><span style="font-weight:700;">$64.20</span>
    </div>
    <div style="display:flex; justify-content:space-between; padding-top:7px; font-size:12px;">
      <span style="color:rgba(11,22,34,0.6);">sam + leo · rent</span><span style="font-weight:700;">$183.30</span>
    </div>
    <div class="dashed" style="margin:14px -22px 0;"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <div class="disp" style="flex:1; background:#0B1622; color:#F4F7FA; border-radius:10px; padding:14px 0; text-align:center; font-size:15.5px;">settle up</div>
      <div class="disp" style="flex:1; background:transparent; color:#0B1622; border:2px solid #0B1622; border-radius:10px; padding:12px 0; text-align:center; font-size:15.5px;">request</div>
    </div>
    <div style="margin-top:18px; height:34px; background:repeating-linear-gradient(90deg,#0B1622 0 2px, transparent 2px 5px, #0B1622 5px 6px, transparent 6px 11px);"></div>
    <div style="text-align:center; font-size:9px; letter-spacing:3px; color:rgba(11,22,34,0.45); margin-top:6px;">SETTLES IN SECONDS · FEE &lt; $0.01</div>
  </div>

  <!-- ticket-stub tabs -->
  <div style="display:flex; align-items:baseline; justify-content:space-between; margin:26px 4px 12px;">
    <span class="disp" style="font-size:20px;">open tabs</span>
    <span style="font-size:10px; letter-spacing:2px; color:#3DE8C7;">2 OPEN</span>
  </div>

  <div style="display:flex; background:#13212E; border:1px solid rgba(244,247,250,0.1); border-radius:14px; overflow:hidden;">
    <div style="width:52px; background:rgba(255,198,92,0.14); border-right:1.5px dashed rgba(244,247,250,0.2); display:flex; align-items:center; justify-content:center; font-size:22px;">🍜</div>
    <div style="flex:1; padding:13px 14px;"><div class="disp" style="font-size:16px;">dinner @ mano's</div><div style="font-size:10px; letter-spacing:1px; color:rgba(244,247,250,0.45); margin-top:4px;">NO. 0042 · 1/3 PAID</div></div>
    <div style="padding:13px 15px; display:flex; align-items:center;"><span style="font-weight:700; font-size:17px; color:#7FC0FF;">$64.20</span></div>
  </div>
  <div style="display:flex; background:#13212E; border:1px solid rgba(244,247,250,0.1); border-radius:14px; overflow:hidden; margin-top:11px;">
    <div style="width:52px; background:rgba(139,92,246,0.16); border-right:1.5px dashed rgba(244,247,250,0.2); display:flex; align-items:center; justify-content:center; font-size:22px;">🏠</div>
    <div style="flex:1; padding:13px 14px;"><div class="disp" style="font-size:16px;">rent + utilities</div><div style="font-size:10px; letter-spacing:1px; color:rgba(244,247,250,0.45); margin-top:4px;">NO. 0043 · DUE FRI</div></div>
    <div style="padding:13px 15px; display:flex; align-items:center;"><span style="font-weight:700; font-size:17px; color:#FFC65C;">$183.30</span></div>
  </div>

  <div style="flex:1;"></div>

  <!-- tab bar: cashier keys -->
  <div style="margin:0 0 30px; background:#13212E; border:1px solid rgba(244,247,250,0.12); border-radius:16px; display:flex; align-items:center; justify-content:space-around; padding:10px 8px;">
    <span style="font-size:10px; letter-spacing:1.5px; color:#0B1622; font-weight:700; background:#3DE8C7; border-radius:8px; padding:8px 13px; box-shadow:0 3px 0 rgba(61,232,199,0.35);">HOME</span>
    <span style="font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.5);">GROUPS</span>
    <div style="width:46px;height:46px;border-radius:12px;background:#2775CA;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;box-shadow:0 4px 0 rgba(39,117,202,0.4);margin:-2px 0;">+</div>
    <span style="font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.5);">FEED</span>
    <span style="font-size:10px; letter-spacing:1.5px; color:rgba(244,247,250,0.5);">YOU</span>
  </div>
</div>
</body></html>
