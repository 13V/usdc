<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; image-rendering:pixelated; }
  body { background:#141034; color:#F4F7FA; font-family:'Space Mono',monospace; height:100vh; overflow:hidden;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:24px 24px; }
  .px { box-shadow: 0 4px 0 #0A0820, 4px 0 0 #0A0820, -4px 0 0 #0A0820, 0 -4px 0 #0A0820; border-radius:0; }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
</style></head><body>
<div style="padding:62px 22px 0; display:flex; flex-direction:column; height:100%;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span style="font-weight:700; font-size:18px; letter-spacing:1px;">DIV<span style="color:#FFC65C;">/</span>VY</span>
    <span style="font-size:11px; color:#FFC65C; font-weight:700;">🪙 ×3 QUESTS</span>
  </div>

  <!-- hero: game HUD -->
  <div class="px" style="margin-top:20px; background:#1D1846; padding:20px 18px;">
    <div style="font-size:10px; letter-spacing:2px; color:#8B5CF6; font-weight:700;">★ BOUNTY POOL ★</div>
    <div style="font-weight:700; font-size:64px; letter-spacing:-2px; margin-top:8px; color:#FFC65C; text-shadow:0 4px 0 #7A4A00;">$247.50</div>
    <div style="font-size:11px; margin-top:4px; color:rgba(244,247,250,0.6);">3 PLAYERS OWE YOU</div>
    <!-- XP bar -->
    <div style="margin-top:14px;">
      <div style="display:flex; justify-content:space-between; font-size:9px; color:rgba(244,247,250,0.55); margin-bottom:5px;"><span>COLLECT PROGRESS</span><span>1/3</span></div>
      <div class="px" style="height:16px; background:#0A0820; display:flex; gap:3px; padding:3px;">
        <span style="flex:1; background:#3DE8C7;"></span><span style="flex:1; background:rgba(244,247,250,0.1);"></span><span style="flex:1; background:rgba(244,247,250,0.1);"></span>
      </div>
    </div>
    <div style="display:flex; gap:14px; margin-top:20px;">
      <div class="px disp" style="flex:1; background:#3DE8C7; color:#0A0820; text-align:center; padding:13px 0; font-size:15px; font-weight:700;">▶ SETTLE UP</div>
      <div class="px disp" style="flex:1; background:#8B5CF6; color:#fff; text-align:center; padding:13px 0; font-size:15px; font-weight:700;">REQUEST</div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:baseline; margin:28px 2px 14px;">
    <span class="disp" style="font-size:19px; letter-spacing:.5px;">ACTIVE QUESTS</span>
    <span style="font-size:10px; color:#3DE8C7; font-weight:700;">2 OPEN</span>
  </div>

  <div class="px" style="background:#1D1846; padding:13px 14px; display:flex; align-items:center; gap:13px;">
    <div class="px" style="width:40px;height:40px;background:#FFC65C;display:flex;align-items:center;justify-content:center;font-size:20px;">🍜</div>
    <div style="flex:1;"><div style="font-weight:700; font-size:14px;">DINNER @ MANO'S</div><div style="font-size:9px; color:rgba(244,247,250,0.5); margin-top:4px;">REWARD: $64.20 · 1/3 CLAIMED</div></div>
    <span style="color:#3DE8C7; font-weight:700; font-size:16px;">$64</span>
  </div>
  <div class="px" style="background:#1D1846; padding:13px 14px; display:flex; align-items:center; gap:13px; margin-top:16px;">
    <div class="px" style="width:40px;height:40px;background:#FF6B5E;display:flex;align-items:center;justify-content:center;font-size:20px;">🏠</div>
    <div style="flex:1;"><div style="font-weight:700; font-size:14px;">RENT + UTILITIES</div><div style="font-size:9px; color:rgba(244,247,250,0.5); margin-top:4px;">BOSS FIGHT · DUE FRIDAY</div></div>
    <span style="color:#FFC65C; font-weight:700; font-size:16px;">$183</span>
  </div>

  <div style="flex:1;"></div>

  <div class="px" style="margin:0 2px 34px; background:#0A0820; display:flex; align-items:center; justify-content:space-around; padding:13px 8px; font-size:10px; font-weight:700;">
    <span style="color:#3DE8C7;">▲HOME</span>
    <span style="color:rgba(244,247,250,0.45);">GROUPS</span>
    <div class="px" style="width:44px;height:44px;background:#FFC65C;color:#0A0820;display:flex;align-items:center;justify-content:center;font-size:24px;margin:-6px 0;">+</div>
    <span style="color:rgba(244,247,250,0.45);">FEED</span>
    <span style="color:rgba(244,247,250,0.45);">YOU</span>
  </div>
</div>
</body></html>
