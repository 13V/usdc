<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#0B0906; color:#EFE6D0; font-family:'General Sans',sans-serif; height:100vh; overflow:hidden; position:relative; }
  .guill { position:fixed; inset:-40%; opacity:.14; pointer-events:none;
    background:repeating-radial-gradient(circle at 50% 42%, transparent 0 7px, rgba(212,175,55,0.5) 7px 7.6px); }
  .gold { color:#D4AF37; }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
  .mono { font-family:'Space Mono',monospace; }
  .frame { border:1px solid rgba(212,175,55,0.45); outline:1px solid rgba(212,175,55,0.18); outline-offset:3px;
    background:linear-gradient(160deg, rgba(212,175,55,0.07), rgba(212,175,55,0.015) 55%); border-radius:14px; }
</style></head><body>
<div class="guill"></div>
<div style="position:relative; padding:62px 22px 0; display:flex; flex-direction:column; height:100%;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span class="disp" style="font-size:22px; letter-spacing:-0.4px;">div<span class="gold">/</span>vy</span>
    <span class="mono gold" style="font-size:9px; letter-spacing:3px;">PRIVATE LEDGER</span>
  </div>

  <!-- hero: engraved vault plate -->
  <div class="frame" style="margin-top:20px; padding:24px 22px; text-align:center;">
    <div class="mono gold" style="font-size:9px; letter-spacing:4px;">— YOU ARE OWED —</div>
    <div class="mono" style="font-weight:700; font-size:66px; letter-spacing:-2px; margin-top:12px;
      background:linear-gradient(175deg,#F6E3A1 15%,#D4AF37 45%,#8C6D1F 80%); -webkit-background-clip:text; background-clip:text; color:transparent;">$247.50</div>
    <div style="display:flex; align-items:center; gap:12px; margin:14px 0 4px;">
      <span style="flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(212,175,55,0.5));"></span>
      <span class="mono" style="font-size:10px; letter-spacing:2px; color:rgba(239,230,208,0.55);">THREE DEBTS OUTSTANDING</span>
      <span style="flex:1; height:1px; background:linear-gradient(90deg,rgba(212,175,55,0.5),transparent);"></span>
    </div>
    <!-- vault dial progress -->
    <div style="display:flex; justify-content:center; margin-top:10px;">
      <div style="width:74px;height:74px;border-radius:50%;background:conic-gradient(#D4AF37 0 120deg, rgba(212,175,55,0.15) 120deg 360deg);display:flex;align-items:center;justify-content:center;">
        <div style="width:58px;height:58px;border-radius:50%;background:#0B0906;border:1px solid rgba(212,175,55,0.4);display:flex;align-items:center;justify-content:center;"><span class="mono gold" style="font-size:12px;font-weight:700;">1/3</span></div>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <div class="disp" style="flex:1; background:linear-gradient(170deg,#F6E3A1,#D4AF37 60%,#A8842B); color:#0B0906; border-radius:10px; padding:14px 0; font-size:15.5px; box-shadow:0 10px 26px rgba(212,175,55,0.28);">settle up</div>
      <div class="disp" style="flex:1; border:1px solid rgba(212,175,55,0.55); color:#EFE6D0; border-radius:10px; padding:13px 0; font-size:15.5px;">request</div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:baseline; margin:26px 4px 12px;">
    <span class="disp" style="font-size:20px;">open accounts</span>
    <span class="mono gold" style="font-size:9px; letter-spacing:2px;">FOLIO 2</span>
  </div>

  <div class="frame" style="padding:14px 16px; display:flex; align-items:center; gap:14px; border-radius:12px;">
    <div style="width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,175,55,0.5);display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(212,175,55,0.08);">🍜</div>
    <div style="flex:1;"><div class="disp" style="font-size:16px;">dinner @ mano's</div><div class="mono" style="font-size:9px; letter-spacing:1.5px; color:rgba(239,230,208,0.45); margin-top:4px;">ENTRY Nº 0042</div></div>
    <span class="mono gold" style="font-weight:700; font-size:17px;">$64.20</span>
  </div>
  <div class="frame" style="padding:14px 16px; display:flex; align-items:center; gap:14px; border-radius:12px; margin-top:12px;">
    <div style="width:42px;height:42px;border-radius:50%;border:1px solid rgba(212,175,55,0.5);display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(212,175,55,0.08);">🏠</div>
    <div style="flex:1;"><div class="disp" style="font-size:16px;">rent + utilities</div><div class="mono" style="font-size:9px; letter-spacing:1.5px; color:rgba(239,230,208,0.45); margin-top:4px;">ENTRY Nº 0043 · DUE FRIDAY</div></div>
    <span class="mono gold" style="font-weight:700; font-size:17px;">$183.30</span>
  </div>

  <div style="flex:1;"></div>

  <div class="frame" style="margin:0 6px 32px; border-radius:999px; display:flex; align-items:center; justify-content:space-around; padding:13px 10px;">
    <span class="mono gold" style="font-size:10px; letter-spacing:2px; font-weight:700;">HOME</span>
    <span class="mono" style="font-size:10px; letter-spacing:2px; color:rgba(239,230,208,0.4);">GROUPS</span>
    <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(170deg,#F6E3A1,#D4AF37 60%,#A8842B);display:flex;align-items:center;justify-content:center;color:#0B0906;font-size:24px;font-weight:700;margin:-14px 0;box-shadow:0 8px 22px rgba(212,175,55,0.4);">+</div>
    <span class="mono" style="font-size:10px; letter-spacing:2px; color:rgba(239,230,208,0.4);">FEED</span>
    <span class="mono" style="font-size:10px; letter-spacing:2px; color:rgba(239,230,208,0.4);">YOU</span>
  </div>
</div>
</body></html>
