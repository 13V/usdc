<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#0A0E14; color:#F4F7FA; font-family:'General Sans',sans-serif; height:100vh; overflow:hidden; }
  .mono { font-family:'Space Mono',monospace; }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
</style></head><body>
<div style="padding:64px 18px 0; display:flex; flex-direction:column; height:100%;">

  <!-- top row -->
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:34px;height:34px;border-radius:10px;background:#2775CA;border:2px solid #F4F7FA;box-shadow:3px 3px 0 #3DE8C7;display:flex;align-items:center;justify-content:center;"><span style="display:inline-block;width:7px;height:20px;background:#fff;border-radius:2px;transform:skewX(-13deg);"></span></div>
      <span class="disp" style="font-size:24px;letter-spacing:-0.8px;">divvy</span>
    </div>
    <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,#FFC65C,#FF6B5E);border:2px solid #F4F7FA;box-shadow:3px 3px 0 rgba(244,247,250,0.25);display:flex;align-items:center;justify-content:center;font-size:19px;">🦊</div>
  </div>

  <!-- hero: loud solid block, sticker stamp -->
  <div style="position:relative; margin-top:18px; background:#2775CA; border:2.5px solid #F4F7FA; border-radius:22px; box-shadow:6px 6px 0 #3DE8C7; padding:22px 20px 20px;">
    <div class="mono" style="font-size:11px; letter-spacing:2px; color:rgba(255,255,255,0.85);">YOU'RE OWED</div>
    <div class="mono" style="font-weight:700; font-size:74px; line-height:0.95; letter-spacing:-3px; margin-top:8px; color:#fff; text-shadow:3px 3px 0 rgba(11,22,34,0.35);">$247<span style="font-size:36px;">.50</span></div>
    <div style="position:absolute; top:14px; right:14px; transform:rotate(8deg); background:#3DE8C7; color:#0A0E14; border:2px solid #0A0E14; border-radius:10px; padding:5px 10px; box-shadow:2px 2px 0 rgba(0,0,0,0.4);"><span class="mono" style="font-weight:700; font-size:11px; letter-spacing:1px;">3 PEOPLE OWE U</span></div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <div class="disp" style="flex:1; background:#F4F7FA; color:#0A0E14; border:2px solid #0A0E14; border-radius:999px; padding:14px 0; text-align:center; font-size:16px; box-shadow:3px 3px 0 rgba(11,22,34,0.4);">settle up</div>
      <div class="disp" style="flex:1; background:transparent; color:#fff; border:2px solid #F4F7FA; border-radius:999px; padding:14px 0; text-align:center; font-size:16px;">request</div>
    </div>
  </div>

  <!-- tabs -->
  <div style="display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 12px;">
    <span class="disp" style="font-size:22px; letter-spacing:-0.4px;">open tabs</span>
    <span class="mono" style="font-size:11px; color:#3DE8C7;">2 LIVE</span>
  </div>

  <div style="background:#131A24; border:2px solid rgba(244,247,250,0.9); border-radius:18px; box-shadow:4px 4px 0 #FF6B5E; padding:14px 16px; display:flex; align-items:center; gap:13px;">
    <div style="width:44px;height:44px;border-radius:12px;background:#FFC65C;border:2px solid #0A0E14;display:flex;align-items:center;justify-content:center;font-size:22px;">🍜</div>
    <div style="flex:1;"><div class="disp" style="font-size:17px;">dinner @ mano's</div><div class="mono" style="font-size:11px;color:rgba(244,247,250,0.55);margin-top:3px;">1 of 3 paid</div></div>
    <div class="mono" style="font-weight:700;font-size:19px;color:#3DE8C7;">$64<span style="font-size:12px;opacity:.7;">.20</span></div>
  </div>
  <div style="background:#131A24; border:2px solid rgba(244,247,250,0.9); border-radius:18px; box-shadow:4px 4px 0 #8B5CF6; padding:14px 16px; display:flex; align-items:center; gap:13px; margin-top:12px;">
    <div style="width:44px;height:44px;border-radius:12px;background:#8B5CF6;border:2px solid #0A0E14;display:flex;align-items:center;justify-content:center;font-size:22px;">🏠</div>
    <div style="flex:1;"><div class="disp" style="font-size:17px;">rent + utilities</div><div class="mono" style="font-size:11px;color:rgba(244,247,250,0.55);margin-top:3px;">due friday</div></div>
    <div class="mono" style="font-weight:700;font-size:19px;color:#FFC65C;">$183<span style="font-size:12px;opacity:.7;">.30</span></div>
  </div>

  <div style="flex:1;"></div>

  <!-- dock -->
  <div style="margin:0 4px 34px; background:#F4F7FA; border-radius:22px; border:2.5px solid #0A0E14; box-shadow:5px 5px 0 #2775CA; display:flex; align-items:center; justify-content:space-around; padding:12px 8px;">
    <span class="mono" style="font-weight:700;font-size:11px;color:#0A0E14;background:#3DE8C7;border:2px solid #0A0E14;border-radius:10px;padding:7px 12px;">HOME</span>
    <span class="mono" style="font-size:11px;color:rgba(10,14,20,0.55);">GROUPS</span>
    <div style="width:48px;height:48px;border-radius:15px;background:#2775CA;border:2px solid #0A0E14;box-shadow:3px 3px 0 #FF6B5E;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;margin:-4px 0;">+</div>
    <span class="mono" style="font-size:11px;color:rgba(10,14,20,0.55);">FEED</span>
    <span class="mono" style="font-size:11px;color:rgba(10,14,20,0.55);">YOU</span>
  </div>
</div>
</body></html>
