<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { margin:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { background:#F7F1E3; color:#2B2118; font-family:'General Sans',sans-serif; height:100vh; overflow:hidden;
    background-image:repeating-linear-gradient(0deg, transparent 0 30px, rgba(43,33,24,0.045) 30px 31px); }
  .disp { font-family:'Clash Display','General Sans',sans-serif; font-weight:600; }
  .mono { font-family:'Space Mono',monospace; }
  .card { background:#FFFDF7; border:2px solid #2B2118; border-radius:16px; box-shadow:4px 5px 0 rgba(43,33,24,0.9); }
  .tape { position:absolute; width:86px; height:24px; background:rgba(61,232,199,0.55); transform:rotate(-5deg);
    border-left:1.5px dashed rgba(43,33,24,0.25); border-right:1.5px dashed rgba(43,33,24,0.25); }
  .doodle { text-decoration:underline wavy rgba(255,107,94,0.75) 2.5px; text-underline-offset:5px; }
</style></head><body>
<div style="padding:60px 22px 0; display:flex; flex-direction:column; height:100%;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span class="disp" style="font-size:25px; letter-spacing:-0.6px; transform:rotate(-1.5deg); display:inline-block;">div<span style="color:#2775CA;">/</span>vy</span>
    <div style="width:42px;height:42px;border-radius:12px;background:#FFC65C;border:2px solid #2B2118;box-shadow:2.5px 3px 0 rgba(43,33,24,0.9);display:flex;align-items:center;justify-content:center;font-size:21px;transform:rotate(3deg);">🦊</div>
  </div>

  <!-- hero: journal page with tape -->
  <div class="card" style="position:relative; margin-top:22px; padding:24px 22px 20px; transform:rotate(-0.6deg);">
    <div class="tape" style="top:-12px; left:34%;"></div>
    <div class="mono" style="font-size:11px; letter-spacing:2px; color:rgba(43,33,24,0.5);">the squad owes u</div>
    <div class="mono" style="font-weight:700; font-size:70px; line-height:1; letter-spacing:-3px; margin-top:8px; color:#2775CA;">$247.50</div>
    <div style="font-size:14px; margin-top:10px; color:rgba(43,33,24,0.75);">maya, sam + leo — <span class="doodle">all of them</span> 💸</div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <div class="disp" style="flex:1; background:#2775CA; color:#FFFDF7; border:2px solid #2B2118; border-radius:999px; padding:13px 0; text-align:center; font-size:16px; box-shadow:3px 3px 0 rgba(43,33,24,0.9);">settle up</div>
      <div class="disp" style="flex:1; background:#FFFDF7; color:#2B2118; border:2px solid #2B2118; border-radius:999px; padding:13px 0; text-align:center; font-size:16px;">request</div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:baseline; margin:26px 6px 12px;">
    <span class="disp doodle" style="font-size:21px;">open tabs</span>
    <span class="mono" style="font-size:11px; color:#FF6B5E; font-weight:700; transform:rotate(2deg); display:inline-block;">2 going!!</span>
  </div>

  <!-- polaroid rows -->
  <div class="card" style="padding:13px 15px; display:flex; align-items:center; gap:13px; transform:rotate(0.7deg); border-radius:14px;">
    <div style="width:46px;height:46px;border-radius:10px;background:#FFE9B8;border:2px solid #2B2118;display:flex;align-items:center;justify-content:center;font-size:23px;">🍜</div>
    <div style="flex:1;"><div class="disp" style="font-size:17px;">dinner @ mano's</div><div class="mono" style="font-size:10.5px;color:rgba(43,33,24,0.5);margin-top:3px;">1 of 3 paid ✓</div></div>
    <span class="mono" style="font-weight:700;font-size:18px;color:#1E9E7E;">$64.20</span>
  </div>
  <div class="card" style="padding:13px 15px; display:flex; align-items:center; gap:13px; margin-top:13px; transform:rotate(-0.8deg); border-radius:14px;">
    <div style="width:46px;height:46px;border-radius:10px;background:#D9CBFF;border:2px solid #2B2118;display:flex;align-items:center;justify-content:center;font-size:23px;">🏠</div>
    <div style="flex:1;"><div class="disp" style="font-size:17px;">rent + utilities</div><div class="mono" style="font-size:10.5px;color:rgba(43,33,24,0.5);margin-top:3px;">due friday !!</div></div>
    <span class="mono" style="font-weight:700;font-size:18px;color:#FF6B5E;">$183.30</span>
  </div>

  <div style="flex:1;"></div>

  <div class="card" style="margin:0 4px 32px; border-radius:999px; display:flex; align-items:center; justify-content:space-around; padding:12px 10px; transform:rotate(0.4deg);">
    <span class="mono" style="font-size:11px; font-weight:700; background:#3DE8C7; border:2px solid #2B2118; border-radius:999px; padding:6px 12px;">home</span>
    <span class="mono" style="font-size:11px; color:rgba(43,33,24,0.5);">groups</span>
    <div style="width:48px;height:48px;border-radius:14px;background:#FF6B5E;border:2px solid #2B2118;box-shadow:3px 3px 0 rgba(43,33,24,0.9);display:flex;align-items:center;justify-content:center;color:#FFFDF7;font-size:25px;font-weight:700;margin:-10px 0;transform:rotate(-3deg);">+</div>
    <span class="mono" style="font-size:11px; color:rgba(43,33,24,0.5);">feed</span>
    <span class="mono" style="font-size:11px; color:rgba(43,33,24,0.5);">you</span>
  </div>
</div>
</body></html>
