<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Divvy — split the bill, settle in seconds</title>
<meta name="theme-color" content="#F7F1E3" />
<script>
  /* Theme boot: resolve "divvy.theme" (auto|light|dark, default auto) and stamp
     html[data-theme] BEFORE the stylesheet applies, so dark mode never flashes
     light paper. app.js keeps it in sync afterwards (system changes + setTheme). */
  (function () {
    var pref = "auto";
    try { pref = localStorage.getItem("divvy.theme") || "auto"; } catch (_) {}
    var dark = pref === "dark" || (pref !== "light" && window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    if (dark) {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", "#1E1913");
    }
  })();
</script>
<meta name="description" content="Split any bill and settle up in seconds. Dollars, just faster — no app needed to pay, no crypto to figure out." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Divvy" />
<meta property="og:title" content="Divvy — split the bill, settle in seconds" />
<meta property="og:description" content="Split any bill and settle up in seconds. Dollars, just faster — no app needed to pay." />
<meta property="og:image" content="/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Divvy — split the bill, settle in seconds" />
<meta name="twitter:description" content="Split any bill and settle up in seconds. Dollars, just faster." />
<meta name="twitter:image" content="/og.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Warm the render-blocking critical path on a cold 4G first paint. Without these
     the fonts are a 3-hop wait (html → divvy.css → @import fonts.css → woff2); the
     stylesheet preload lets the CSS fetch start with the HTML, and the two most-used
     faces (General Sans 400 body, Clash Display 600 display) download in parallel
     instead of after the @import resolves. All @font-face already use font-display:swap. -->
<link rel="preload" href="/divvy.css" as="style" />
<link rel="preload" href="/fonts/7YY3ZAAE3TRV2LANYOLXNHTPHLXVWTKH.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/Z3MGHFHX6DCTLQ55LJYRJ5MDCZPMFZU6.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/divvy.css" />
<style>
  /* Lock the document: the page itself must never scroll or rubber-band (the
     native drag-the-whole-app bounce reads as "webview"). Only #view scrolls. */
  html, body { position: fixed; inset: 0; overflow: hidden; background: var(--paper-deep); }
  /* No double-tap-to-zoom anywhere (touch-action isn't inherited, so hit all
     elements); "manipulation" keeps panning + normal taps intact. */
  * { touch-action: manipulation; }
  /* center a phone-width column on desktop */
  #app { position: relative; max-width: 430px; height: 100%; margin: 0 auto; background: var(--paper);
    display: flex; flex-direction: column; overflow: hidden;
    /* keep content clear of the notch / Dynamic Island on device (0 on web) */
    padding-top: env(safe-area-inset-top); }
  #view { position: relative; z-index: 1; flex: 1; overflow-y: auto; overscroll-behavior-y: contain; }
  /* no visible scrollbars anywhere — app, not webpage */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
</style>
</head>
<body>
  <div id="app" class="paper">
    <div id="aurora" aria-hidden="true"></div>
    <div id="view"></div>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <!-- All app scripts are `defer`: they download in parallel without blocking the
       parser and execute in DOM order after parse (before DOMContentLoaded). Order
       is load-bearing and preserved exactly — faces.js/mascot.js provide globals the
       screens use to render avatars, auth.js + app.js bootstrap the runtime, then the
       screen modules register window.Screens[name], then recap.js. defer keeps that
       ordering guarantee while making the whole set non-render-blocking. -->
  <script defer src="/faces.js"></script>
  <script defer src="/mascot.js"></script>
  <script defer src="/auth.js"></script>
  <script defer src="/app.js"></script>
  <!-- screen modules (each registers window.Screens[name]) -->
  <script defer src="/screens/home.js"></script>
  <script defer src="/screens/welcome.js"></script>
  <script defer src="/screens/groups.js"></script>
  <script defer src="/screens/group.js"></script>
  <script defer src="/screens/new.js"></script>
  <script defer src="/screens/settle.js"></script>
  <script defer src="/screens/collect.js"></script>
  <script defer src="/screens/activity.js"></script>
  <script defer src="/screens/friends.js"></script>
  <script defer src="/screens/friend.js"></script>
  <script defer src="/screens/tabs.js"></script>
  <script defer src="/screens/tab.js"></script>
  <script defer src="/screens/recurring.js"></script>
  <script defer src="/screens/subscriptions.js"></script>
  <script defer src="/screens/mochi.js"></script>
  <script defer src="/screens/journal.js"></script>
  <script defer src="/screens/you.js"></script>
  <script defer src="/screens/customize.js"></script>
  <script defer src="/screens/chat.js"></script>
  <script defer src="/screens/receipt.js"></script>
  <script defer src="/recap.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
  </script>
</body>
</html>
