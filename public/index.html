<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Divvy — split the bill, settle in USDC</title>
<meta name="theme-color" content="#0B1622" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/divvy.css" />
<style>
  html, body { height: 100%; background: var(--ink-deep); }
  /* center a phone-width column on desktop */
  #app { position: relative; max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; }
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #view::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
  <div id="app" class="paper">
    <div class="statusbar">
      <span>9:41</span>
      <span class="mono" style="font-size:11px;color:var(--muted);letter-spacing:1px;">5G ▮</span>
    </div>
    <div id="view"></div>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <script src="/mascot.js"></script>
  <script src="/auth.js"></script>
  <script src="/app.js"></script>
  <!-- screen modules (each registers window.Screens[name]) -->
  <script src="/screens/home.js"></script>
  <script src="/screens/groups.js"></script>
  <script src="/screens/group.js"></script>
  <script src="/screens/new.js"></script>
  <script src="/screens/settle.js"></script>
  <script src="/screens/collect.js"></script>
  <script src="/screens/activity.js"></script>
  <script src="/screens/friends.js"></script>
  <script src="/screens/friend.js"></script>
  <script src="/screens/recurring.js"></script>
  <script src="/screens/you.js"></script>
  <script src="/screens/customize.js"></script>
  <script src="/screens/chat.js"></script>
  <script src="/screens/receipt.js"></script>
  <script src="/recap.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
  </script>
</body>
</html>
