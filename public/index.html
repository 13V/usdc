<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Divvy — split the bill, settle in seconds</title>
<meta name="theme-color" content="#0B1622" />
<meta name="description" content="Split any bill and settle up in seconds. Dollars, just faster — no app needed to pay, no crypto to figure out." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Divvy" />
<meta property="og:title" content="Divvy — split the bill, settle in seconds" />
<meta property="og:description" content="Split any bill and settle up in seconds. Dollars, just faster — no app needed to pay." />
<meta property="og:image" content="/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Divvy — split the bill, settle in seconds" />
<meta name="twitter:description" content="Split any bill and settle up in seconds. Dollars, just faster." />
<meta name="twitter:image" content="/og.png" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/divvy.css" />
<style>
  /* Lock the document: the page itself must never scroll or rubber-band (the
     native drag-the-whole-app bounce reads as "webview"). Only #view scrolls. */
  html, body { position: fixed; inset: 0; overflow: hidden; background: var(--ink-deep); }
  /* No double-tap-to-zoom anywhere (touch-action isn't inherited, so hit all
     elements); "manipulation" keeps panning + normal taps intact. */
  * { touch-action: manipulation; }
  /* center a phone-width column on desktop */
  #app { position: relative; max-width: 430px; height: 100%; margin: 0 auto; background: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    /* keep content clear of the notch / Dynamic Island on device (0 on web) */
    padding-top: env(safe-area-inset-top); }
  #view { position: relative; z-index: 1; flex: 1; overflow-y: auto; overscroll-behavior-y: contain; }
  /* no visible scrollbars anywhere — app, not webpage */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
</style>
</head>
<body>
  <div id="app" class="paper">
    <div id="aurora" aria-hidden="true"></div>
    <div id="view"></div>
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <script src="/mascot.js"></script>
  <script src="/auth.js"></script>
  <script src="/app.js"></script>
  <!-- screen modules (each registers window.Screens[name]) -->
  <script src="/screens/home.js"></script>
  <script src="/screens/welcome.js"></script>
  <script src="/screens/groups.js"></script>
  <script src="/screens/group.js"></script>
  <script src="/screens/new.js"></script>
  <script src="/screens/settle.js"></script>
  <script src="/screens/collect.js"></script>
  <script src="/screens/activity.js"></script>
  <script src="/screens/friends.js"></script>
  <script src="/screens/friend.js"></script>
  <script src="/screens/recurring.js"></script>
  <script src="/screens/you.js"></script>
  <script src="/screens/customize.js"></script>
  <script src="/screens/chat.js"></script>
  <script src="/screens/receipt.js"></script>
  <script src="/recap.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
  </script>
</body>
</html>
